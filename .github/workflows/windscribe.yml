name: Windscribe 订阅自动化更新

on:
  workflow_dispatch:
    inputs:
      publish_sub_branch:
        description: '是否将订阅发布到 sub 分支（提供永久在线的 raw 订阅链接）'
        required: false
        type: boolean
        default: true
  schedule:
    # 每天凌晨 3 点自动更新 Windscribe 节点与账号额度
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  extract-windscribe:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 执行 Windscribe 自动化开户与节点提取
        run: |
          set -euo pipefail
          python3 scripts/extract_all.py --vpn windscribe --outdir dist
          ls -la dist/

      - name: 发布订阅文件到 sub 分支
        if: ${{ always() && (github.event_name == 'schedule' || !inputs.publish_sub_branch || inputs.publish_sub_branch == true || inputs.publish_sub_branch == 'true') }}
        run: |
          set -euo pipefail
          
          git clone --depth 1 --branch sub "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo-sub 2>/dev/null || {
            mkdir repo-sub
            cd repo-sub
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git checkout -b sub
            cd ..
          }

          # 增量同步 Windscribe 相关产物进 repo-sub，不影响其他 VPN 节点
          if [ -d dist ] && [ "$(ls -A dist)" ]; then
            cp -r dist/* repo-sub/
          fi

          # 重新聚合全量 all-proxies.txt
          python3 scripts/extract_all.py --aggregate-only --outdir repo-sub

          cd repo-sub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "订阅内容无变动，跳过提交"
          else
            git commit -m "自动更新: Windscribe 节点订阅 ($(date -u '+%Y-%m-%d %H:%M:%S') UTC)"
            git push origin sub --force
          fi
          cd ..
          rm -rf repo-sub

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: windscribe-subscription
          path: dist/
          retention-days: 7

      - name: 生成运行报告与订阅链接
        if: always()
        run: |
          REPO="${{ github.repository }}"
          {
            echo "## 🚀 Windscribe 订阅提取完成"
            echo ""
            echo "### 📦 在线订阅直链 (可直接复制到 sout 面板订阅源中):"
            echo "- **Windscribe 独立节点列表**: \`https://raw.githubusercontent.com/${REPO}/sub/windscribe-links.txt\`"
            echo "- **单行代理节点聚合列表 (全部汇总)**: \`https://raw.githubusercontent.com/${REPO}/sub/all-proxies.txt\`"
            echo ""
            echo "### 📄 本次提取产物文件列表:"
            if [ -d dist ]; then
              ls -l dist | awk '{print "- " $9 " (" $5 " bytes)"}'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
