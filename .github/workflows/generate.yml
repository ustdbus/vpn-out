name: VPN 订阅自动化提取与更新

on:
  workflow_dispatch:
    inputs:
      vpn_type:
        description: '需要提取的 VPN 类型'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windscribe
          - opera
          - warp
          - proton
      publish_sub_branch:
        description: '是否将订阅发布到 sub 分支（提供永久在线的 raw 订阅链接）'
        required: false
        type: boolean
        default: true
  schedule:
    # 每月 1 号凌晨 4 点对齐 Windscribe 额度重置，并定期自动刷新
    - cron: '0 4 1 * *'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 准备 WARP 注册工具 (若需要)
        if: ${{ inputs.vpn_type == 'all' || inputs.vpn_type == 'warp' }}
        run: |
          set -euo pipefail
          VER=$(curl -sL https://api.github.com/repos/Diniboy1123/usque/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "下载 usque v$VER"
          curl -sL -o usque.zip "https://github.com/Diniboy1123/usque/releases/download/v${VER}/usque_${VER}_linux_amd64.zip"
          unzip -oq usque.zip && chmod +x usque
          ./usque register -a -n "vpn-out-actions"
          test -s config.json

      - name: 执行自动化注册与订阅提取
        env:
          PROTON_USER: ${{ secrets.PROTON_USER }}
          PROTON_PASS: ${{ secrets.PROTON_PASS }}
        run: |
          set -euo pipefail
          python3 scripts/extract_all.py --vpn "${{ inputs.vpn_type || 'all' }}" --outdir dist
          ls -la dist/

      - name: 发布订阅文件到 sub 分支
        if: ${{ github.event.inputs.publish_sub_branch != 'false' }}
        run: |
          set -euo pipefail
          PUBLISH_DIR=$(mktemp -d)
          cp -r dist/* "$PUBLISH_DIR/"
          
          git clone --depth 1 --branch sub "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo-sub 2>/dev/null || {
            mkdir repo-sub
            cd repo-sub
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git checkout -b sub
            cd ..
          }
          cd repo-sub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          cp -r "$PUBLISH_DIR"/* .
          git add -A
          if git diff --staged --quiet; then
            echo "订阅内容无变动，跳过提交"
          else
            git commit -m "自动更新: VPN 节点订阅 ($(date -u '+%Y-%m-%d %H:%M:%S') UTC)"
            git push origin sub --force
          fi
          cd ..
          rm -rf repo-sub "$PUBLISH_DIR"

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: vpn-subscriptions
          path: dist/
          retention-days: 7

      - name: 生成运行报告与订阅链接
        if: always()
        run: |
          REPO="${{ github.repository }}"
          {
            echo "## 🚀 VPN 订阅提取完成"
            echo ""
            echo "### 📦 在线订阅直链 (可直接复制到 sout 面板订阅源中):"
            echo "- **单行代理节点聚合列表 (sout 推荐)**: \`https://raw.githubusercontent.com/${REPO}/sub/all-proxies.txt\`"
            echo "- **Mihomo / Clash 聚合订阅**: \`https://raw.githubusercontent.com/${REPO}/sub/clash-subscription.yaml\`"
            echo "- **Windscribe 节点列表**: \`https://raw.githubusercontent.com/${REPO}/sub/windscribe-links.txt\`"
            echo "- **Opera 节点列表**: \`https://raw.githubusercontent.com/${REPO}/sub/opera-links.txt\`"
            echo "- **WARP MASQUE 节点列表**: \`https://raw.githubusercontent.com/${REPO}/sub/warp-masque-links.txt\`"
            echo ""
            echo "### 📄 提取产物文件列表:"
            if [ -d dist ]; then
              ls -l dist | awk '{print "- " $9 " (" $5 " bytes)"}'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
