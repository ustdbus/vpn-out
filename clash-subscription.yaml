mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true

proxies:
  - name: WARP-WireGuard
    type: wireguard
    server: engage.cloudflareclient.com
    port: 2408
    ip: 172.16.0.2
    ipv6: 2606:4700:110:863a:5f66:2949:969e:c779
    public-key: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
    private-key: gAA9RhXX9dWIlDsVBFx+qmQaFhV0UQvcOW4cGsah+UM=
    udp: true
    remote-dns-resolve: true
    dns: [1.1.1.1, 2606:4700:4700::1111]
    mtu: 1280
    reserved: [0, 0, 0]

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - ⚡ WARP直连
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - WARP-WireGuard
  - name: ⚡ WARP直连
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - WARP-WireGuard
rules:
  - MATCH,🚀 节点选择
