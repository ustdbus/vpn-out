name: 全量 VPN 订阅自动化提取与更新 (All)

on:
  workflow_dispatch:
    inputs:
      vpn_type:
        description: '需要提取的 VPN 类型'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windscribe
          - opera
          - proton
      publish_sub_branch:
        description: '是否将订阅发布到 sub 分支（提供永久在线的 raw 订阅链接）'
        required: false
        type: boolean
        default: true
  schedule:
    # 每隔 3 天，北京时间凌晨 3:00 (UTC 19:00) 自动全量提取更新
    - cron: '0 19 */3 * *'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python3 -m pip install --upgrade pip
          pip install cryptography

      - name: 执行自动化注册与订阅提取
        env:
          PROTON_USER: ${{ secrets.PROTON_USER }}
          PROTON_PASS: ${{ secrets.PROTON_PASS }}
        run: |
          set -euo pipefail
          python3 scripts/extract_all.py --vpn "${{ inputs.vpn_type || 'all' }}" --outdir dist
          ls -la dist/

      - name: 发布订阅文件到 sub 分支
        if: ${{ always() && (github.event_name == 'schedule' || !inputs.publish_sub_branch || inputs.publish_sub_branch == true || inputs.publish_sub_branch == 'true') }}
        run: |
          set -euo pipefail
          
          git clone --depth 1 --branch sub "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo-sub 2>/dev/null || {
            mkdir repo-sub
            cd repo-sub
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git checkout -b sub
            cd ..
          }

          # 将新提取的文件增量覆盖同步进 repo-sub（安全保留其它服务的历史有效产物）
          if [ -d dist ] && [ "$(ls -A dist)" ]; then
            cp -r dist/* repo-sub/
          fi

          # 在 repo-sub 中重新调用全量智能聚合（确保 all-proxies.txt 包含所有源）
          python3 scripts/extract_all.py --aggregate-only --outdir repo-sub

          cd repo-sub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "订阅内容无变动，跳过提交"
          else
            git commit -m "自动更新: VPN 节点订阅 ($(date -u '+%Y-%m-%d %H:%M:%S') UTC)"
            for attempt in {1..5}; do
              if git push origin sub; then
                echo "成功推送到 sub 分支"
                break
              fi
              echo "推送发生竞争，拉取最新内容重试 ($attempt/5)..."
              sleep $((attempt * 3))
              git fetch origin sub || true
              git rebase -X ours origin/sub || true
              if [ -d ../dist ] && [ "$(ls -A ../dist)" ]; then
                cp -r ../dist/* ./
              fi
              python3 ../scripts/extract_all.py --aggregate-only --outdir .
              git add -A
              git commit --amend --no-edit || true
            done
          fi
          cd ..
          rm -rf repo-sub

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: vpn-subscriptions
          path: dist/
          retention-days: 7

      - name: 生成运行报告与订阅链接
        if: always()
        run: |
          REPO="${{ github.repository }}"
          {
            echo "## 🚀 VPN 订阅提取完成"
            echo ""
            echo "### 📦 在线订阅直链 (可直接复制到 sout 面板订阅源中):"
            echo "- **单行代理节点聚合列表 (sout 推荐)**: \`https://raw.githubusercontent.com/${REPO}/sub/all-proxies.txt\`"
            echo "- **Windscribe 节点列表**: \`https://raw.githubusercontent.com/${REPO}/sub/windscribe-links.txt\`"
            echo "- **Opera 节点列表**: \`https://raw.githubusercontent.com/${REPO}/sub/opera-links.txt\`"
            echo "- **Proton 节点列表**: \`https://raw.githubusercontent.com/${REPO}/sub/proton-links.txt\`"

            echo ""
            echo "### 📄 提取产物文件列表:"
            if [ -d dist ]; then
              ls -l dist | awk '{print "- " $9 " (" $5 " bytes)"}'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
